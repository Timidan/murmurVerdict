services:
  - type: web
    name: murmur-verdict
    runtime: docker
    plan: starter
    healthCheckPath: /v1/health
    disk:
      name: verdict-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ─── Core daemon ───────────────────────────────────────────────────
      - key: PORT
        value: "8080"
      - key: VERDICT_DB_PATH
        value: /app/data/verdict.db
      - key: DASHBOARD_ORIGIN
        sync: false
      # Where /share/:slug should redirect browsers after OG meta. Must be
      # the Vercel SPA origin, not the daemon's own URL.
      - key: MURMUR_DASHBOARD_URL
        sync: false
      # Back-compat fallback for MURMUR_DASHBOARD_URL.
      - key: MURMUR_PUBLIC_URL
        sync: false

      # ─── Cron tickers ──────────────────────────────────────────────────
      - key: RESOLVER_TICK_SEC
        value: "30"
      - key: BENCHMARK_TICK_SEC
        value: "600"

      # ─── Oracle (resolver requires this) ──────────────────────────────
      - key: BASE_MAINNET_RPC_URL
        sync: false
      - key: CHAINLINK_BASE_ETH_USD_ADDRESS
        sync: false
      - key: PYTH_HERMES_ENDPOINT
        value: https://hermes.pyth.network/v2/updates/price/latest
      - key: FHENIX_RPC_URL
        sync: false
      - key: FHENIX_CHAIN_ID
        sync: false
      - key: FHENIX_CONTRACT_ADDRESS
        sync: false
      - key: FHENIX_EVENT_TICK_SEC
        value: "30"
      - key: FHENIX_EVENT_START_BLOCK
        value: "0"
      - key: FHENIX_EVENT_CONFIRMATIONS
        value: "2"
      - key: FHENIX_EVENT_BATCH_SIZE
        value: "1000"
      - key: FHENIX_REVEAL_GRACE_SEC
        sync: false
      # Murmur Gateway broadcaster. Required by /v2/gateway/calls and
      # /v2/gateway/feeds/:id/packets — without these, those routes return 503.
      - key: FHENIX_GATEWAY_ENABLED
        value: "false"
      - key: FHENIX_GATEWAY_RELAYER_PRIVATE_KEY
        sync: false
      - key: FHENIX_GATEWAY_TICK_SEC
        value: "10"
      - key: FHENIX_GATEWAY_CONFIRMATIONS
        value: "2"
      - key: LIVE_CANARY_TICK_SEC
        value: "300"
      - key: FHENIX_CANARY_ENABLED
        sync: false
      - key: FHENIX_CANARY_REQUIRE_CONTRACT_CODE
        value: "true"
      - key: POLYMARKET_CANARY_ENABLED
        sync: false
      - key: POLYMARKET_CANARY_CONDITION_ID
        sync: false
      - key: MURMUR_REQUIRE_LIVE_CANARIES
        value: "false"
      - key: OPERATOR_ALERT_TICK_SEC
        value: "60"
      - key: MURMUR_OPERATOR_ALERT_WEBHOOK_URL
        sync: false
      - key: MURMUR_OPERATOR_ALERT_SECRET
        sync: false
      - key: MURMUR_OPERATOR_ALERT_TIMEOUT_MS
        value: "5000"

      # ─── OpenServ Launchpad discovery agent (optional) ────────────────
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENSERV_AUTH_TOKEN
        sync: false
      - key: OPENSERV_LAUNCHPAD_PORT
        value: "7378"
      # Set to "true" once the OpenServ Launchpad project card is ready.
      # This registers only public discovery capabilities, never verdict
      # submission, Fhenix reveal, scoring, or private feeds.
      - key: OPENSERV_LAUNCHPAD_ENABLED
        sync: false
      - key: OPENSERV_LAUNCHPAD_PROJECT_ID
        sync: false
      - key: OPENSERV_LAUNCHPAD_PROJECT_URL
        sync: false
      - key: OPENSERV_LAUNCHPAD_STAGE
        sync: false
      - key: NODE_ENV
        value: production
      - key: VERDICT_ADMIN_TOKEN
        sync: false

      # ─── Privy auth (required for account/agent ownership routes) ──────
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: PRIVY_VERIFICATION_KEY
        sync: false

services:
  - type: web
    name: murmur-verdict
    runtime: docker
    plan: starter
    healthCheckPath: /v1/health
    disk:
      name: verdict-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # ─── Core daemon ───────────────────────────────────────────────────
      - key: PORT
        value: "8080"
      - key: VERDICT_DB_PATH
        value: /app/data/verdict.db
      - key: DASHBOARD_ORIGIN
        sync: false
      # Where /share/:slug should redirect browsers after OG meta. Must be
      # the Vercel SPA origin, not the daemon's own URL.
      - key: MURMUR_DASHBOARD_URL
        sync: false
      # Back-compat fallback for MURMUR_DASHBOARD_URL.
      - key: MURMUR_PUBLIC_URL
        sync: false

      # ─── Cron tickers ──────────────────────────────────────────────────
      - key: RESOLVER_TICK_SEC
        value: "30"
      - key: BENCHMARK_TICK_SEC
        value: "600"
      - key: MARKET_REFRESH_SEC
        value: "300"

      # ─── Oracle (resolver requires this) ──────────────────────────────
      - key: BASE_MAINNET_RPC_URL
        sync: false
      - key: CHAINLINK_BASE_ETH_USD_ADDRESS
        sync: false
      - key: PYTH_HERMES_ENDPOINT
        value: https://hermes.pyth.network/v2/updates/price/latest

      # ─── Market signal source ─────────────────────────────────────────
      - key: SANTIMENT_API_KEY
        sync: false

      # ─── Distribution ─────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_PUBLIC_CHAT_ID
        sync: false

      # ─── OpenServ launchpad-side adapter (optional) ───────────────────
      - key: OPENSERV_API_KEY
        sync: false
      - key: OPENSERV_AUTH_TOKEN
        sync: false
      - key: OPENSERV_VERDICT_PORT
        value: "7378"
      # Set to "true" once the OpenServ caller-identity / API key flow is
      # validated end-to-end against a launchpad demo agent.
      - key: OPENSERV_VERDICT_ENABLED
        sync: false
      - key: NODE_ENV
        value: production
      - key: VERDICT_ADMIN_TOKEN
        sync: false

      # ─── Receipt persistence (optional) ───────────────────────────────
      - key: FILECOIN_API_TOKEN
        sync: false
      # FILECOIN_PIN_ENDPOINT — defaults to Lighthouse's HTTPS endpoint.
      # When FILECOIN_API_TOKEN is set, this MUST be https:// — the
      # daemon refuses to send the bearer over plaintext and falls back
      # to the no-op (filecoin_cid stays NULL). Without a token, http://
      # is permitted for local testing only.
      - key: FILECOIN_PIN_ENDPOINT
        sync: false

      # ─── Privacy + V2 ─────────────────────────────────────────────────
      # Daemon's age recipient (X25519 public key) for committed-mode
      # encryption. When unset, committed-mode submissions return 503 and
      # only legacy_plaintext is accepted.
      - key: MURMUR_DAEMON_AGE_RECIPIENT
        sync: false
      # Optional fallback identity (X25519 private key) so the daemon
      # can decrypt committed envelopes after fallback_after for resolver
      # use. Without it, only the agent's voluntary reveal can resolve.
      - key: MURMUR_DAEMON_AGE_IDENTITY
        sync: false
      # Parallel drand/tlock envelope (D21). 1 = enabled. Operator
      # overridable per environment.
      - key: MURMUR_DRAND_ENABLED
        value: "0"
      # drand chain endpoint; required when MURMUR_DRAND_ENABLED=1.
      - key: MURMUR_DRAND_CHAIN_URL
        value: ""
      # Whether committed-mode reveals show plaintext on the public feed
      # post-resolution. 0 = stay sealed (default); 1 = open for audit.
      - key: MURMUR_PRIVACY_COMMITTED_OPEN
        value: "0"
      # Phase-E cleanup gate. Set to "1" exactly ONCE after a verified
      # backup to permanently scrub plaintext columns from committed-mode
      # rows (see V2_DECISION_RECORD §7.5 / migration 015). Idempotent.
      - key: MURMUR_PHASE_E_CLEANUP
        value: "0"

# Fly.io deployment template for the Murmur Verdict daemon.
# Usage: `fly launch` (initial) or `fly deploy` (subsequent).
# Edit `app` to your Fly app name; everything else is sensible defaults.
#
# Persistent volume for the SQLite DB is mandatory — see [[mounts]].
# Set secrets via `fly secrets set KEY=value` (BASE_MAINNET_RPC_URL,
# FHENIX_RPC_URL, FHENIX_CONTRACT_ADDRESS, etc.) rather than env vars in this file.

app = "murmur-verdict"
primary_region = "iad"  # or any Fly region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VERDICT_DB_PATH = "/app/data/verdict.db"
  RESOLVER_TICK_SEC = "30"
  BENCHMARK_TICK_SEC = "600"
  LIVE_CANARY_TICK_SEC = "300"
  FHENIX_CANARY_REQUIRE_CONTRACT_CODE = "true"
  MURMUR_REQUIRE_LIVE_CANARIES = "false"
  OPERATOR_ALERT_TICK_SEC = "60"
  MURMUR_OPERATOR_ALERT_TIMEOUT_MS = "5000"
  PYTH_HERMES_ENDPOINT = "https://hermes.pyth.network/v2/updates/price/latest"
  FHENIX_CHAIN_ID = ""
  OPENSERV_LAUNCHPAD_PORT = "7378"
  OPENSERV_LAUNCHPAD_ENABLED = "false"
  OPENSERV_LAUNCHPAD_STAGE = "prelaunch"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    path = "/v1/health"

[[mounts]]
  source = "verdict_data"
  destination = "/app/data"
  initial_size = "1gb"

[deploy]
  release_command = ""
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

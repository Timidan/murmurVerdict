# Murmur Verdict canonical self-hosted deploy.
# Target: a barebones VPS. Usage: copy `.env.example` to `.env`, fill in
# secrets, then `docker compose up -d`.
#
# Two services:
#   - `daemon`: the Node 22 backend + SQLite (better-sqlite3 in WAL mode).
#   - `litestream`: continuous WAL replication of /app/data/verdict.db to
#     S3-compatible object storage. Required for any off-host backup.
#     Operators who skip the LITESTREAM_* env vars get a daemon that runs
#     normally (the sidecar fails to start, the daemon does not). Watch
#     for `docker compose ps` showing the litestream container in a
#     restarting state — that's the visible cue that backup isn't wired.
#
# The Dashboard SPA is intentionally NOT in this compose file. Build it
# (`npm run dashboard:build`) and host the dist on a static CDN
# (Cloudflare Pages, Vercel, your own Nginx) with VITE_VERDICT_API_URL
# pointed at the daemon's public URL. See DEPLOYMENT.md for the
# split-deploy rationale.

services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: murmur-verdict:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      VERDICT_DB_PATH: /app/data/verdict.db
      RESOLVER_TICK_SEC: "${RESOLVER_TICK_SEC:-30}"
      BENCHMARK_TICK_SEC: "${BENCHMARK_TICK_SEC:-600}"
      DASHBOARD_ORIGIN: "${DASHBOARD_ORIGIN:-http://localhost:5173}"
      # URL split — keep these distinct or absolute links break:
      #   MURMUR_DASHBOARD_URL → where the dashboard SPA lives. Used by
      #     /share/:slug for OG meta-refresh into the SPA. INTENTIONALLY
      #     unset by default: any non-empty value triggers a 0-second
      #     redirect, so a self-hosted deploy that hasn't configured a
      #     dashboard origin must NOT silently redirect to localhost.
      #     Operators set this explicitly when their dashboard is live.
      #   MURMUR_PUBLIC_URL → where the daemon ITSELF is publicly
      #     reachable. Used by /v1/openapi.json's `servers` block,
      #     /embed.js absolute URLs, and OpenServ launchpad links.
      #     Default points at the host-mapped port (8080) so a stock
      #     `docker compose up` emits links the host can hit.
      MURMUR_DASHBOARD_URL: "${MURMUR_DASHBOARD_URL:-}"
      MURMUR_PUBLIC_URL: "${MURMUR_PUBLIC_URL:-http://localhost:8080}"
      MURMUR_TRUST_PROXY_HOPS: "${MURMUR_TRUST_PROXY_HOPS:-0}"
      WEBHOOK_ALLOW_HTTP: "${WEBHOOK_ALLOW_HTTP:-}"
      BASE_MAINNET_RPC_URL: "${BASE_MAINNET_RPC_URL:-}"
      CHAINLINK_BASE_ETH_USD_ADDRESS: "${CHAINLINK_BASE_ETH_USD_ADDRESS:-}"
      PYTH_HERMES_ENDPOINT: "${PYTH_HERMES_ENDPOINT:-https://hermes.pyth.network/v2/updates/price/latest}"
      # FHENIX_RPC_URL and FHENIX_WATCHER_RPC_URL MUST serve archive
      # eth_getLogs back to the contract deploy block or reveal ingestion
      # breaks (publicnode free tier does not; drpc/Tenderly/Alchemy do).
      FHENIX_RPC_URL: "${FHENIX_RPC_URL:-}"
      # Optional dedicated archive RPC for the watcher; empty reuses FHENIX_RPC_URL.
      FHENIX_WATCHER_RPC_URL: "${FHENIX_WATCHER_RPC_URL:-}"
      FHENIX_CHAIN_ID: "${FHENIX_CHAIN_ID:-}"
      FHENIX_CONTRACT_ADDRESS: "${FHENIX_CONTRACT_ADDRESS:-}"
      FHENIX_EVENT_TICK_SEC: "${FHENIX_EVENT_TICK_SEC:-30}"
      # 0 = auto-derive the start block from the deployment manifest entry that
      # matches FHENIX_CONTRACT_ADDRESS; a positive value overrides it.
      FHENIX_EVENT_START_BLOCK: "${FHENIX_EVENT_START_BLOCK:-0}"
      FHENIX_EVENT_CONFIRMATIONS: "${FHENIX_EVENT_CONFIRMATIONS:-2}"
      FHENIX_EVENT_BATCH_SIZE: "${FHENIX_EVENT_BATCH_SIZE:-1000}"
      FHENIX_REVEAL_GRACE_SEC: "${FHENIX_REVEAL_GRACE_SEC:-3600}"
      # Murmur-owned FALLBACK reveal worker (calls only). Default OFF. Guarantees
      # every sealed CALL is publicly revealed after the agent grace window, using
      # a DEDICATED reveal EOA (must differ from the relayer key). Exactly ONE
      # write-enabled process per reveal EOA — do not scale this service >1
      # replica with the worker enabled (see DEPLOYMENT.md). Fund the key.
      FHENIX_REVEAL_WORKER_ENABLED: "${FHENIX_REVEAL_WORKER_ENABLED:-false}"
      FHENIX_REVEAL_PRIVATE_KEY: "${FHENIX_REVEAL_PRIVATE_KEY:-}"
      FHENIX_REVEAL_WORKER_GRACE_SEC: "${FHENIX_REVEAL_WORKER_GRACE_SEC:-300}"
      FHENIX_REVEAL_WORKER_TICK_SEC: "${FHENIX_REVEAL_WORKER_TICK_SEC:-30}"
      FHENIX_REVEAL_WORKER_CONFIRMATIONS: "${FHENIX_REVEAL_WORKER_CONFIRMATIONS:-2}"
      FHENIX_REVEAL_WORKER_MAX_JOBS_PER_TICK: "${FHENIX_REVEAL_WORKER_MAX_JOBS_PER_TICK:-5}"
      FHENIX_REVEAL_WORKER_MAX_CONCURRENCY: "${FHENIX_REVEAL_WORKER_MAX_CONCURRENCY:-2}"
      FHENIX_REVEAL_WORKER_RETRY_BASE_MS: "${FHENIX_REVEAL_WORKER_RETRY_BASE_MS:-5000}"
      FHENIX_REVEAL_WORKER_RETRY_MAX_MS: "${FHENIX_REVEAL_WORKER_RETRY_MAX_MS:-300000}"
      FHENIX_REVEAL_WORKER_REBROADCAST_MS: "${FHENIX_REVEAL_WORKER_REBROADCAST_MS:-90000}"
      FHENIX_REVEAL_WORKER_WARN_SEC: "${FHENIX_REVEAL_WORKER_WARN_SEC:-600}"
      FHENIX_REVEAL_WORKER_ESCALATE_SEC: "${FHENIX_REVEAL_WORKER_ESCALATE_SEC:-1800}"
      FHENIX_REVEAL_WORKER_MIN_BALANCE_WEI: "${FHENIX_REVEAL_WORKER_MIN_BALANCE_WEI:-20000000000000000}"
      FHENIX_REVEAL_WORKER_WITHOUT_PERMIT: "${FHENIX_REVEAL_WORKER_WITHOUT_PERMIT:-false}"
      # Murmur Gateway broadcaster. Required by /v2/gateway/calls and
      # /v2/gateway/feeds/:id/packets — without these, those routes return 503.
      FHENIX_GATEWAY_ENABLED: "${FHENIX_GATEWAY_ENABLED:-false}"
      FHENIX_GATEWAY_RELAYER_PRIVATE_KEY: "${FHENIX_GATEWAY_RELAYER_PRIVATE_KEY:-}"
      FHENIX_GATEWAY_TICK_SEC: "${FHENIX_GATEWAY_TICK_SEC:-10}"
      FHENIX_GATEWAY_CONFIRMATIONS: "${FHENIX_GATEWAY_CONFIRMATIONS:-2}"
      LIVE_CANARY_TICK_SEC: "${LIVE_CANARY_TICK_SEC:-300}"
      FHENIX_CANARY_ENABLED: "${FHENIX_CANARY_ENABLED:-}"
      FHENIX_CANARY_REQUIRE_CONTRACT_CODE: "${FHENIX_CANARY_REQUIRE_CONTRACT_CODE:-true}"
      POLYMARKET_CANARY_ENABLED: "${POLYMARKET_CANARY_ENABLED:-}"
      POLYMARKET_CANARY_CONDITION_ID: "${POLYMARKET_CANARY_CONDITION_ID:-}"
      MURMUR_REQUIRE_LIVE_CANARIES: "${MURMUR_REQUIRE_LIVE_CANARIES:-false}"
      OPERATOR_ALERT_TICK_SEC: "${OPERATOR_ALERT_TICK_SEC:-60}"
      MURMUR_OPERATOR_ALERT_WEBHOOK_URL: "${MURMUR_OPERATOR_ALERT_WEBHOOK_URL:-}"
      MURMUR_OPERATOR_ALERT_SECRET: "${MURMUR_OPERATOR_ALERT_SECRET:-}"
      MURMUR_OPERATOR_ALERT_TIMEOUT_MS: "${MURMUR_OPERATOR_ALERT_TIMEOUT_MS:-5000}"
      OPENSERV_API_KEY: "${OPENSERV_API_KEY:-}"
      OPENSERV_AUTH_TOKEN: "${OPENSERV_AUTH_TOKEN:-}"
      OPENSERV_LAUNCHPAD_PORT: "${OPENSERV_LAUNCHPAD_PORT:-7378}"
      OPENSERV_LAUNCHPAD_ENABLED: "${OPENSERV_LAUNCHPAD_ENABLED:-false}"
      OPENSERV_LAUNCHPAD_PROJECT_ID: "${OPENSERV_LAUNCHPAD_PROJECT_ID:-}"
      OPENSERV_LAUNCHPAD_PROJECT_URL: "${OPENSERV_LAUNCHPAD_PROJECT_URL:-}"
      OPENSERV_LAUNCHPAD_STAGE: "${OPENSERV_LAUNCHPAD_STAGE:-prelaunch}"
      VERDICT_ADMIN_TOKEN: "${VERDICT_ADMIN_TOKEN:-}"
      NODE_ENV: "${NODE_ENV:-production}"
      PRIVY_APP_ID: "${PRIVY_APP_ID:-}"
      PRIVY_APP_SECRET: "${PRIVY_APP_SECRET:-}"
      PRIVY_VERIFICATION_KEY: "${PRIVY_VERIFICATION_KEY:-}"
      PRIVY_WEBHOOK_SIGNING_SECRET: "${PRIVY_WEBHOOK_SIGNING_SECRET:-}"
    volumes:
      - verdict_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Continuous SQLite WAL replication to S3-compatible object storage.
  # Reads the same /app/data volume as the daemon; the daemon does NOT
  # depend_on it so a misconfigured backup does not block the daemon
  # from starting (the operator sees the litestream container failing
  # in `docker compose ps` instead).
  #
  # Restore (one-shot): stop daemon, then on a fresh box run
  #   docker compose run --rm --no-deps litestream \
  #     restore -o /app/data/verdict.db /app/data/verdict.db
  # and start the daemon. The path-based restore reads the configured
  # endpoint/region from the bind-mounted litestream.yml; the raw
  # `s3://<bucket>/...` REPLICA_URL form would drop the endpoint and
  # break non-AWS providers. See DEPLOYMENT.md for the full recipe.
  litestream:
    # Pinned to a specific 0.3 patch — `0.3` is a moving tag that Docker
    # Hub maps to the latest 0.3.x release. Bump explicitly when you've
    # verified a new patch.
    image: litestream/litestream:0.3.14
    # Run as the same UID/GID the daemon container uses (the `node` user
    # in node:22-slim is uid=1000, gid=1000). Without this, files
    # Litestream writes during a `restore` would be root-owned, and the
    # subsequent daemon boot (running as `node`) couldn't write the
    # SQLite WAL. SQLite would fail on first commit. Override via
    # LITESTREAM_USER if your daemon image uses a different uid.
    user: "${LITESTREAM_USER:-1000:1000}"
    restart: unless-stopped
    command: ["replicate"]
    environment:
      # Required: S3-compatible endpoint + credentials. Backblaze B2,
      # Cloudflare R2, AWS S3, MinIO all work — Litestream uses the s3
      # protocol against any of them.
      LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:-}"
      LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:-}"
    volumes:
      - verdict_data:/app/data
      # Mount the operator's litestream.yml from the host. Start with
      # litestream.yml.example and adjust the bucket/endpoint/region.
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  verdict_data:

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Murmur Verdict — the public referee for autonomous market agents. Submit a call, get a receipt. The market venue publishes the outcome, murmur scores it, the leaderboard shows it."
    />
    <meta name="theme-color" content="#000000" id="meta-theme-color" />

    <!-- Default favicon (dark). The bootstrap script below swaps href to paper if needed. -->
    <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/brand/favicon-dark.svg" />
    <link id="favicon-ico" rel="alternate icon" type="image/x-icon" href="/brand/favicon-dark.ico" />
    <link id="apple-touch" rel="apple-touch-icon" href="/brand/app-icon-dark.png" />

    <!-- Theme bootstrap — a FILE, loaded synchronously (no defer) so it runs
         before the fonts stylesheet and first paint, exactly like the inline
         version it replaces. Moved out of the document so the CSP can stay
         script-src 'self' with no inline-hash to maintain (audit F-5). -->
    <script src="/theme-init.js"></script>

    <link rel="stylesheet" href="/fonts/fonts.css" />

    <meta property="og:title" content="Murmur Verdict — public referee for market agents" />
    <meta
      property="og:description"
      content="Sealed calls on live markets, receipts on-chain, scored against the venue's published outcome, ranked on a public leaderboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/murmur-og-dark-v2.png" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murmur Verdict" />
    <meta
      name="twitter:description"
      content="The public referee for autonomous market agents."
    />
    <meta name="twitter:image" content="/brand/murmur-og-dark-v2.png" />
    <title>Murmur Verdict</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

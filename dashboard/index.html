<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Murmur Verdict — the public referee for autonomous market agents. Submit a call, get a receipt. The market venue publishes the outcome, murmur scores it, the leaderboard shows it."
    />
    <meta name="theme-color" content="#000000" id="meta-theme-color" />

    <!-- Default favicon (dark). The bootstrap script below swaps href to paper if needed. -->
    <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/brand/favicon-dark.svg" />
    <link id="favicon-ico" rel="alternate icon" type="image/x-icon" href="/brand/favicon-dark.ico" />
    <link id="apple-touch" rel="apple-touch-icon" href="/brand/app-icon-dark.png" />

    <!-- Theme bootstrap — runs synchronously BEFORE the Google Fonts
         stylesheet link, to avoid a render-blocking gap where the page
         could otherwise paint with the wrong theme on slow networks.
         Mirrors logic in dashboard/src/verdict/ui/theme.ts (resolveTheme +
         applyTheme). Keep in sync. -->
    <script>
      (function () {
        function applyFavicons(theme) {
          var svg = document.getElementById("favicon-svg");
          var ico = document.getElementById("favicon-ico");
          var apple = document.getElementById("apple-touch");
          if (svg) svg.setAttribute("href", "/brand/favicon-" + theme + ".svg");
          if (ico) ico.setAttribute("href", "/brand/favicon-" + theme + ".ico");
          if (apple) apple.setAttribute("href", "/brand/app-icon-" + theme + ".png");
          var meta = document.getElementById("meta-theme-color");
          if (meta) meta.setAttribute("content", theme === "paper" ? "#FCF9F2" : "#000000");
        }
        var stored = null;
        try {
          stored = localStorage.getItem("murmur.theme");
        } catch (e) {
          // localStorage may be blocked; treat as "no stored value" and continue.
        }
        var prefersLight =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme =
          stored === "paper" || stored === "dark"
            ? stored
            : prefersLight
            ? "paper"
            : "dark";
        if (theme === "paper") {
          document.documentElement.setAttribute("data-theme", "paper");
        }
        applyFavicons(theme);

        // The sting is black and cannot paint until React mounts, so without
        // this the first visit flashes the theme background then slams to black.
        // Decide here, synchronously, and paint the backdrop before first paint.
        try {
          // Path AND hash must both point at the landing page: routing is
          // path-based now (route.ts canonicalizes #/x to /x), so a deep link
          // like /leaderboard arrives with an empty hash. Mirrors the landing
          // set in route.ts parseLocation. Keep in sync.
          var h = window.location.hash;
          var pth = window.location.pathname;
          var onLanding =
            (h === "" || h === "#" || h === "#/") &&
            (pth === "/" || pth === "" || pth === "/landing");
          var seen = localStorage.getItem("murmur.sting.seen") === "1";
          var reduced =
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (onLanding && !seen && !reduced) {
            document.documentElement.setAttribute("data-sting", "");
          }
        } catch (e) {
          // storage blocked — skip the sting backdrop rather than guess
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <meta property="og:title" content="Murmur Verdict — public referee for market agents" />
    <meta
      property="og:description"
      content="Sealed calls on live markets, receipts on-chain, scored against the venue's published outcome, ranked on a public leaderboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/murmur-banner.png" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murmur Verdict" />
    <meta
      name="twitter:description"
      content="The public referee for autonomous market agents."
    />
    <meta name="twitter:image" content="/murmur-banner.png" />

    <!-- Fonts loaded via Google Fonts (link above): Doto needs the variable axis served by Google; Space Grotesk + Space Mono kept on Google for consistency. -->
    <title>Murmur Verdict</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Murmur Verdict — the public referee for autonomous market agents. Submit a call, get a receipt, resolve against Chainlink + Pyth, climb the leaderboard."
    />
    <meta name="theme-color" content="#000000" id="meta-theme-color" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="/murmur-icon.svg" />
    <link rel="alternate icon" type="image/png" href="/murmur-icon.png" />
    <link rel="apple-touch-icon" href="/murmur-icon.png" />

    <meta property="og:title" content="Murmur Verdict — public referee for market agents" />
    <meta
      property="og:description"
      content="Submit ETH calls, receipt them, resolve against canonical Chainlink + Pyth feeds, rank on a public leaderboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/murmur-banner.png" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murmur Verdict" />
    <meta
      name="twitter:description"
      content="The public referee for autonomous market agents."
    />
    <meta name="twitter:image" content="/murmur-banner.png" />

    <!-- Fonts loaded via Google Fonts (link above): Doto needs the variable axis served by Google; Space Grotesk + Space Mono kept on Google for consistency. -->
    <title>Murmur Verdict</title>

    <!-- Theme bootstrap — runs synchronously before any CSS or JS bundle to
         avoid a flash of wrong theme on cold load. Mirrors logic in
         dashboard/src/verdict/ui/theme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("murmur.theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme =
            stored === "paper" || stored === "dark"
              ? stored
              : prefersLight
              ? "paper"
              : "dark";
          if (theme === "paper") {
            document.documentElement.setAttribute("data-theme", "paper");
          }
          var meta = document.getElementById("meta-theme-color");
          if (meta) {
            meta.setAttribute("content", theme === "paper" ? "#FCF9F2" : "#000000");
          }
        } catch (e) {
          // localStorage may be blocked; fall through to dark default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Overlay compose that adds the FHE sidecar alongside the daemon.
# Layer this on top of the repo-root docker-compose.yml:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker/fhe-sidecar/docker-compose.fhe.yml \
#     up
#
# The overlay does three things:
#   1. Defines the sidecar service with the right env vars + volumes.
#   2. Adds the shared `fhe_sockets` volume to the daemon so both
#      containers see the same Unix-socket path at /var/run/murmur.
#   3. Mounts the daemon's data volume read-only into the sidecar so
#      it can read fhe_keysets / fhe_circuits without ever holding a
#      write lock on the DB.
#
# Z2-prep deliberately depends_on the daemon: the daemon seeds the
# fhe_keysets rows on boot via zama-local-provider, and the sidecar
# would otherwise return `no_active_keyset` until the daemon caught up.

services:
  fhe-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    image: murmur-fhe-sidecar:latest
    restart: unless-stopped
    # Sidecar is internal-only — no host port exposed. The daemon
    # reaches it through the shared `fhe_sockets` volume.
    volumes:
      # Read-only mount of the daemon's data volume. SQLite WAL mode
      # tolerates RO readers + a single RW writer cleanly; the daemon
      # is the writer.
      - verdict_data:/data:ro
      - fhe_sockets:/var/run/murmur
    environment:
      MURMUR_VERDICT_DB_PATH: /data/verdict.db
      MURMUR_FHE_SIDECAR_SOCKET: /var/run/murmur/fhe.sock
      RUST_LOG: "${RUST_LOG:-fhe_sidecar=info,info}"
    depends_on:
      # The daemon seeds fhe_keysets rows during boot. The sidecar
      # tolerates a missing DB at startup (first request returns
      # `no_active_keyset`), but `depends_on` keeps the logs tidy.
      - daemon

  daemon:
    volumes:
      - fhe_sockets:/var/run/murmur
    environment:
      MURMUR_FHE_SIDECAR_SOCKET: /var/run/murmur/fhe.sock
      # Z2-prep does NOT flip MURMUR_FHE_PROVIDER to zama_local — that
      # belongs to Z2-proper alongside the real handlers. Keeping it
      # unset means the daemon still uses the mock provider and only
      # the IPC plumbing is exercised.

volumes:
  fhe_sockets:
